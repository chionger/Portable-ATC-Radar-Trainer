[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-atc-radar-trainer"
version = "0.1.0"
description = "Offline-first Portable ATC Radar Trainer foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.11.4",
  "uvicorn==0.34.2",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.15.0",
  "pytest==8.3.5",
  "ruff==0.11.10",
]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api", "packages", "scripts/check_architecture.py"]
